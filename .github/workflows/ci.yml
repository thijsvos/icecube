# CI for Ice Cube. Builds unsigned (no Local.xcconfig on CI), runs the
# IceCubeKit unit tests, lints, and verifies the app bundle — including the
# capability boundary that keeps the SMC writer out of the app binary.
#
# CI has no fans and no root: everything here must pass on a bare runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A rapid series of pushes should not queue N full builds; keep the newest.
# `main` is exempt so every landed commit gets a real result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pick the newest installed Xcode 26.x rather than pinning an exact
      # path: runner images retire point releases without notice, and a hard
      # path turns that into a red build with a misleading error.
      - name: Select Xcode
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "No Xcode 26.x on this image; available:" >&2
            find /Applications -maxdepth 1 -name 'Xcode*.app' >&2 || true
            exit 1
          fi
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen swiftformat

      - name: Note tool versions
        # These two are the only unpinned executables in the build: Homebrew
        # cannot pin formula versions, which is why there is no `homebrew`
        # ecosystem in .github/dependabot.yml.
        #
        # Warn, never fail. A hard gate would break CI the day either formula is
        # bumped, and the risk here is *silence*, not a wrong build — xcodegen
        # regenerates the project from project.yml, and swiftformat gates the
        # lint below, so a behaviour change in either lands with no repo change
        # to point at. Making that visible is the whole job of this step.
        run: |
          check() {
            have=$("$1" --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "$1 $have (Brewfile documents $2)"
            [ "$have" = "$2" ] || echo "::warning::$1 drifted $2 -> $have; check its release notes against project.yml"
          }
          check xcodegen 2.46.0
          check swiftformat 0.62.1

      - name: Generate Xcode project
        run: xcodegen generate

      # Lint before building: a formatting failure should not cost a full
      # compile to discover.
      - name: Lint
        run: swiftformat --lint .

      # `-warnings-as-errors` here and `SWIFT_TREAT_WARNINGS_AS_ERRORS` below:
      # "builds clean with no new warnings" is the project's definition of done
      # (CLAUDE.md), and until 2026-08-02 nothing enforced it — a superfluous
      # `await` sat in DaemonCoreTests as the repo's only warning until an audit
      # found it. A rule nothing checks is a rule that decays.
      #
      # CI-only, deliberately: this is NOT set in project.yml, so a local build
      # still tolerates the half-finished code you get mid-edit. The gate is on
      # what LANDS, not on how you get there.
      #
      # The cost is real and accepted: a macOS SDK deprecation can fail this on
      # a PR that did not cause it. When that happens the fix is to address the
      # deprecation, not to quietly delete this flag.
      - name: Run IceCubeKit tests
        run: cd IceCubeKit && swift test -Xswiftc -warnings-as-errors

      - name: Build app (unsigned)
        run: >
          xcodebuild -project IceCube.xcodeproj -scheme IceCube
          -configuration Debug -derivedDataPath build
          build CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # Layout + the capability boundary (app must link no SMC writer).
      # Ad-hoc signed (`CODE_SIGN_IDENTITY=-`), NOT unsigned like the build step
      # above. An unsigned .xctest bundle will not load: the runner sits there
      # and xcodebuild eventually reports "the test runner timed out while
      # preparing to run tests", which reads like a hang rather than a signing
      # problem. Ad-hoc needs no certificate, so it works on a bare runner.
      - name: Run app-target tests
        run: >
          xcodebuild test -project IceCube.xcodeproj -scheme IceCube
          -configuration Debug -derivedDataPath build
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES DEVELOPMENT_TEAM=""
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Verify bundle
        run: sh scripts/verify-bundle.sh

      # Simulated mode is a hard project rule: every feature must be
      # demonstrable with no root, no helper and no real SMC. If the app
      # cannot even stay up under ICECUBE_SIMULATED=1, that rule is broken.
      - name: Smoke-test simulated mode
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug/Ice Cube.app/Contents/MacOS/Ice Cube"
          ICECUBE_SIMULATED=1 "$APP" > /tmp/icecube-sim.log 2>&1 &
          pid=$!
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "ok: simulated mode ran for 15s without exiting"
            kill "$pid" || true
          else
            echo "FAIL: app exited under ICECUBE_SIMULATED=1" >&2
            cat /tmp/icecube-sim.log >&2
            exit 1
          fi

      - name: Upload simulated-mode log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simulated-mode-log
          path: /tmp/icecube-sim.log
          if-no-files-found: ignore
