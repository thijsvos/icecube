# Auto-merges Dependabot's low-risk PRs once CI is green, so routine version
# bumps land without anyone watching for them. Majors are deliberately excluded.
#
# WHY MAJORS ARE EXCLUDED: every Actions major this project has seen was a Node
# runtime move (20 -> 24) carrying a minimum-runner requirement. Those deserve a
# human read, not a rubber stamp. Patch and minor bumps do not.
#
# SECURITY NOTE — `pull_request_target` runs with repository write access, which
# is why it is dangerous when combined with checking out PR code. This workflow
# **never checks anything out**: it reads Dependabot's own metadata and asks the
# GitHub API to enable auto-merge. No untrusted code executes here. The actor
# guard below is belt-and-braces on top of that.
name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only ever Dependabot's own PRs. `github.actor` is set by GitHub and cannot
    # be spoofed by a fork.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest # not macOS: this job compiles nothing, and macOS
      # concurrency on public repos is a shared, limited pool
    timeout-minutes: 5
    steps:
      - name: Read Dependabot metadata
        id: meta
        # SHA-pinned like every other action that runs with write permissions
        # here — see the note in release.yml.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        # `--auto` does not merge now: it tells GitHub to merge *when required
        # checks pass*. If CI fails, the PR simply sits there.
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag majors for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump — not auto-merged. Check the release notes for runtime or minimum-runner changes before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
