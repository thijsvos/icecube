# project.yml — XcodeGen spec; the gitignored IceCube.xcodeproj is generated from this file.
#
# Workflow: edit THIS file, then run `xcodegen generate`. Never change build settings,
# schemes, or file membership in the Xcode GUI — regeneration silently wipes GUI edits.
# Signing (DEVELOPMENT_TEAM) lives only in the gitignored Configs/Local.xcconfig,
# pulled in via Configs/Shared.xcconfig; CI builds with CODE_SIGNING_ALLOWED=NO.

name: IceCube

options:
  bundleIdPrefix: io.github.thijsvos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configFiles:
  Debug: Configs/Shared.xcconfig
  Release: Configs/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  IceCubeKit:
    path: IceCubeKit

targets:
  # Root LaunchDaemon helper (SMAppService). Plain executable ("tool"), embedded
  # into Ice Cube.app/Contents/MacOS by the app target's dependency below.
  IceCubeHelper:
    type: tool
    platform: macOS
    sources: [IceCubeHelper]
    dependencies:
      - package: IceCubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.thijsvos.icecube.helper
        SKIP_INSTALL: YES
        # Daemon code must never be MainActor-bound by default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # Command-line tools sign with PRODUCT_NAME ("IceCubeHelper") as their
        # code-signing identifier by default — but the app's XPC pinning
        # requires the bundle id. Force it explicitly.
        OTHER_CODE_SIGN_FLAGS: --identifier io.github.thijsvos.icecube.helper

  # The menu-bar app (LSUIElement — no Dock icon). Target/scheme are named
  # IceCube (automation-safe, no space); the PRODUCT the user sees is "Ice Cube".
  IceCube:
    type: application
    platform: macOS
    sources:
      - path: IceCube
      # The launchd plist must land in Contents/Library/LaunchDaemons (where
      # SMAppService looks for it), NOT in Resources — hence the explicit
      # per-file copyFiles build phase overriding the default for this file.
      - path: IceCube/Support/io.github.thijsvos.icecube.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: IceCube/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Ice Cube
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        NSHumanReadableCopyright: "MIT — github.com/thijsvos"
        # AppIcon.icns has always shipped in Resources but was never DECLARED,
        # so macOS fell back to the generic application icon everywhere the app
        # is seen: Finder, System Settings → Login Items (during the one
        # permission step a new user must complete), notifications, and the
        # Move-to-Applications flow. Generated by scripts/generate-icon.sh from
        # the same Noto artwork as the menu-bar glyph.
        CFBundleIconFile: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.thijsvos.icecube
        PRODUCT_NAME: Ice Cube
        # Without this the Swift module is named after PRODUCT_NAME with the
        # space escaped — `Ice_Cube` — so the test target would have to say
        # `@testable import Ice_Cube`. Naming it explicitly keeps the import
        # matching the target and the repo.
        PRODUCT_MODULE_NAME: IceCube
        # UI code defaults to the main actor; helper/kit stay nonisolated.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # Extract literal SwiftUI strings into the String Catalog at build.
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: IceCubeKit
      # embed + copy to executables puts the signed helper binary at
      # Ice Cube.app/Contents/MacOS/IceCubeHelper (required by the launchd plist's
      # BundleProgram path). Copy-phase code signing defaults to on.
      - target: IceCubeHelper
        embed: true
        copy:
          destination: executables

  # Unit tests for the APP target. IceCubeKit has its own SwiftPM tests
  # (`swift test`); this exists because a good deal of real logic lives on the
  # app side and, until now, none of it could be tested at all — a bug in
  # `HelperManager` and a locale bug in the fan-speed formatting both had to be
  # caught by hand on hardware, and the formatter had to be moved into
  # IceCubeKit before it could carry a regression test.
  #
  # HOST-LESS on purpose. Hosting the tests in Ice Cube.app was tried first and
  # hangs: it is an LSUIElement menu-bar app that opens an XPC connection to the
  # root daemon during launch, and XCTest gives up with "the test runner hung
  # before establishing connection". Even if it were coaxed into working, every
  # CI run would be launching a menu-bar app and talking to a daemon that does
  # not exist on the runner.
  #
  # So the app sources under test are compiled INTO the test bundle instead of
  # imported from the app binary. That works because these are self-contained
  # value/state types — the moment a file needs the running app around it, it is
  # the wrong thing to unit-test anyway. Add such files to `sources` below.
  IceCubeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - IceCubeTests
      - IceCube/CurveEditorModel.swift
      - IceCube/HelperManager.swift
      - IceCube/HelperDependencies.swift
      - IceCube/HelperClient.swift
      - IceCube/PresetStore.swift
      - IceCube/PowerSourceMonitor.swift
    dependencies:
      - package: IceCubeKit
    settings:
      base:
        # Matches the app target: these tests exercise MainActor-isolated types.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.thijsvos.icecube.tests

# Schemes are generated from here so they are versioned (no .xcuserdatad needed).
schemes:
  IceCube:
    build:
      targets:
        IceCube: all
        IceCubeTests: [test]
    test:
      config: Debug
      targets:
        - IceCubeTests
    run:
      config: Debug
  "IceCube (Simulated)":
    build:
      targets:
        IceCube: all
    run:
      config: Debug
      environmentVariables:
        ICECUBE_SIMULATED: "1"
